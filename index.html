<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bader Suliman – Portfolio</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin="" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Trebuchet MS", Verdana, sans-serif;
      background: #ffffff; color: #111;
    }

    /* Container */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Header */
    header { text-align: center; margin-bottom: 40px; }
    header h1 {
      font-size: 3rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    nav a {
      padding: 8px 18px;
      border-radius: 12px;
      border: 2px solid #d0d7de;
      text-decoration: none;
      color: #333;
      transition: 0.25s;
    }

    nav a.active,
    nav a:hover {
      border-color: #009fa5;
      background: #e6f9f9;
      color: #009fa5;
    }

    /* ===== EDUCATION MAPS ===== */
    #education { margin-bottom: 40px; }

    .education-maps {
      display: none; /* hidden until Education is clicked */
      width: 100%;
      justify-content: center;
      align-items: flex-start;
      gap: 120px; /* more spacing for balance */
      margin-top: 70px; /* maps placed lower */
    }

    .map-column {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .map-label {
      font-size: 0.9rem;
      letter-spacing: 0.25em;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .country-map {
      width: 300px;
      height: 300px;
    }

    .leaflet-container {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    /* ===== GALLERY ===== */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      grid-auto-rows: 200px;
      margin-top: 30px;
      gap: 10px;
    }

    .gallery-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: grayscale(40%) brightness(0.85);
      opacity: 0.7;
      transition: 0.35s;
    }

    .gallery-item:hover img {
      opacity: 1;
      filter: none;
      transform: scale(1.03);
    }

    /* Progress bar */
    #scrollProgress {
      position: fixed; top: 0; left: 0;
      width: 0; height: 4px;
      background: #009fa5;
      z-index: 9999;
    }

    /* Back to top */
    #backToTop {
      position: fixed;
      bottom: 24px; right: 24px;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #009fa5;
      border: none;
      display: none;
      justify-content: center;
      align-items: center;
      color: white; font-size: 22px;
      cursor: pointer;
      z-index: 9999;
    }
  </style>
</head>

<body>
  <div id="scrollProgress"></div>
  <div class="page">

    <header>
      <h1>Bader Suliman</h1>

      <nav>
        <ul>
          <li><a href="#home" class="active">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#education">Education</a></li>
          <li><a href="#experience">Experience</a></li>
          <li><a href="#work">Work</a></li>
          <li><a href="#activities">Activities</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main id="home">

      <!-- ===== EDUCATION MAPS ===== -->
      <section id="education">
        <div class="education-maps">

          <!-- LEFT → FRANCE -->
          <div class="map-column">
            <div class="map-label">FRANCE</div>
            <div id="map-france" class="country-map"></div>
          </div>

          <!-- CENTER → JAPAN -->
          <div class="map-column">
            <div class="map-label">JAPAN</div>
            <div id="map-japan" class="country-map"></div>
          </div>

          <!-- RIGHT → GERMANY -->
          <div class="map-column">
            <div class="map-label">GERMANY</div>
            <div id="map-germany" class="country-map"></div>
          </div>

        </div>
      </section>

      <!-- ===== GALLERY (hidden during Education) ===== -->
      <section class="gallery">
        <a class="gallery-item"><img src="image1.jpg"></a>
        <a class="gallery-item"><img src="image2.jpg"></a>
        <a class="gallery-item"><img src="image3.jpg"></a>
        <a class="gallery-item"><img src="img1.jpg"></a>
        <a class="gallery-item"><img src="images/img5.jpg"></a>
        <a class="gallery-item"><img src="images/img6.jpg"></a>
      </section>

    </main>
  </div>

  <button id="backToTop">↑</button>

  <!-- LEAFLET JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /* ===== Scroll Progress Bar ===== */
    window.addEventListener("scroll", () => {
      const s = window.scrollY;
      const d = document.documentElement.scrollHeight - window.innerHeight;
      document.getElementById("scrollProgress").style.width = (s / d) * 100 + "%";
    });

    /* ===== Back to top ===== */
    window.addEventListener("scroll", () => {
      document.getElementById("backToTop").style.display =
        window.scrollY > 300 ? "flex" : "none";
    });
    document.getElementById("backToTop").onclick = () =>
      window.scrollTo({ top: 0, behavior: "smooth" });

    /* ===============================
       STATIC OUTLINES — FIXED & CENTERED
    =============================== */

    let worldData = null;
    let mapsLoaded = false;

    const COUNTRY_NAMES = {
      france: ["france"],
      germany: ["germany"],
      japan: ["japan"]
    };

    const normalize = s =>
      s.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

    async function loadGeoJSON() {
      if (worldData) return worldData;
      const urls = [
        "https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json",
        "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson"
      ];
      for (let url of urls) {
        try {
          let r = await fetch(url);
          if (r.ok) return (worldData = await r.json());
        } catch (e) {}
      }
    }

    function drawCountry(containerId, country, center, zoom) {
      const map = L.map(containerId, {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false,
        touchZoom: false,
        doubleClickZoom: false,
        keyboard: false,
      });
      map.setView(center, zoom);

      const aliases = COUNTRY_NAMES[country].map(normalize);

      L.geoJSON(worldData, {
        filter: f => aliases.includes(normalize(f.properties.ADMIN || f.properties.name)),
        style: { color: "#222", weight: 1.8, fillOpacity: 0 }
      }).addTo(map);
    }

    async function initMaps() {
      if (mapsLoaded) return;
      mapsLoaded = true;

      await loadGeoJSON();

      document.querySelector(".education-maps").style.display = "flex";

      /* PERFECT FULL OUTLINE ZOOM LEVELS */
      drawCountry("map-france", "france", [46.6, 2.2], 4.2);
      drawCountry("map-japan", "japan", [37.8, 138.5], 3.9);
      drawCountry("map-germany", "germany", [51.1, 10.3], 4.6);
    }

    /* ===============================
         NAVIGATION LOGIC
    =============================== */
    document.querySelectorAll("nav a").forEach(a => {
      a.addEventListener("click", () => {
        const target = a.getAttribute("href");
        document.querySelectorAll("nav a").forEach(n => n.classList.remove("active"));
        a.classList.add("active");

        if (target === "#education") {
          document.querySelector(".gallery").style.display = "none";
          initMaps();
        } else {
          document.querySelector(".gallery").style.display = "grid";
        }
      });
    });
  </script>
</body>
</html>
