<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root { --bg:#ffffff; --text:#0f172a; --accent:#0ea5a2; --radius:18px; }
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial;background:var(--bg);color:var(--text);}
    .wrap{max-width:1100px;margin:auto;padding:32px;}
    header{display:flex;align-items:center;justify-content:space-between;padding:24px;border-bottom:1px solid #e2e8f0;}
    .card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:var(--radius);padding:24px;box-shadow:0 10px 30px rgba(2,6,23,.07);}
    a.button{padding:10px 16px;border-radius:999px;border:1px solid #e2e8f0;text-decoration:none}
    a.button:hover{border-color:var(--accent)}
  </style>
</head>
<body>
  <header class="wrap">
    <h1>👋 Hello, I’m <span style="color:var(--accent)">Your Name</span></h1>
    <nav><a class="button" href="#work">Work</a> <a class="button" href="#contact">Contact</a></nav>
  </header>
  <main class="wrap">
    <section id="work" class="card">
      <h2>Featured Work</h2>
      <p>Short intro about you and what this site is for.</p>
    </section>
    <section id="contact" style="margin-top:24px" class="card">
      <h2>Contact</h2>
      <p>Email: you@example.com · LinkedIn: /in/yourprofile</p>
    </section>
  </main>
</body>
</html>
