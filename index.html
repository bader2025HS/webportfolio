<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Portfolio — responsive (education + transparent map focus)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin />

<style>
  :root{
    --header:72px; --maxw:860px;
    --bg1:#eafaf7; --bg2:#f7fbff; --bg3:#e9f8ff;
    --text:#0f172a; --muted:#475569; --card:#f8fafc; --line:#e2e8f0;
    --accent:#0ea5a2; --accent2:#1fbdb9;
    --radius:18px; --shadow:0 10px 30px rgba(2,6,23,.07);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth; scroll-padding-top:calc(var(--header) + 14px)}
  body{
    margin:0; color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial;
    background:linear-gradient(120deg,var(--bg1),var(--bg2),var(--bg3));
    background-size:200% 200%; animation:bgShift 22s ease infinite;
  }
  @keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  body:before{content:""; position:fixed; inset:0; z-index:-2; opacity:.05; pointer-events:none;
    background:
      repeating-linear-gradient(90deg,#000 0 1px,transparent 1px 26px),
      repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 26px);
    mix-blend-mode:soft-light;}
  body::after{content:""; position:fixed; inset:0; z-index:-2; pointer-events:none; opacity:.18;
    background:
      repeating-radial-gradient(circle at 20% 30%, rgba(2,6,23,.08) 0 2px, transparent 2px 18px),
      repeating-radial-gradient(circle at 75% 60%, rgba(2,6,23,.06) 0 2px, transparent 2px 22px);
    filter:blur(.2px)}

  .wrap{max-width:var(--maxw); margin-inline:auto; padding:clamp(16px,4vw,22px)}
  .section{margin:clamp(24px,6vw,46px) 0}
  .section h2{margin:0 0 6px; font-size:clamp(26px,4.2vw,38px)}
  .lead{color:var(--muted)}

  header{
    position:sticky; top:0; z-index:9999; height:var(--header);
    background:rgba(255,255,255,.95); border-bottom:1px solid var(--line);
    backdrop-filter:saturate(120%) blur(10px);
  }
  header .inner{max-width:var(--maxw); height:100%; margin:auto; padding:0 16px;
    display:flex; align-items:center; justify-content:space-between; gap:12px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; white-space:nowrap}
  .badge{width:34px; height:34px; border-radius:10px; flex:0 0 34px;
    background:conic-gradient(from 220deg,var(--accent),var(--accent2)); box-shadow:0 6px 18px rgba(2,6,23,.06)}
  header nav#siteNav{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  nav a{color:var(--muted); text-decoration:none; font-weight:600; padding:6px 8px; border-radius:10px}
  nav a:hover{color:var(--accent)} nav a.active{color:var(--accent)}

  #progress{position:fixed; top:0; left:0; height:3px; width:0; z-index:10000;
    background:linear-gradient(90deg,var(--accent),#7c61ff,#ff7a6e,#f59e0b)}
  h1{font-size:clamp(40px,6vw,64px); margin:0 0 6px}
  .btn{display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:14px; border:1px solid var(--line); font-weight:700; text-decoration:none}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent}
  .btn.ghost{background:var(--card); color:var(--text)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:clamp(14px,2vw,18px)}

  /* ===== EDUCATION scroller (no white container) ===== */
  #edu-scroll .box{
    position:relative;
    background:transparent !important;
    border:none !important;
    border-radius:0 !important;
    box-shadow:none !important;
    padding:0 !important;
    overflow:visible;
  }
  #edu-scroll .tray{
    display:flex; gap:12px; align-items:center;
    overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
    padding:0;                      /* no extra space on mobile */
    scrollbar-width:none; -ms-overflow-style:none;
  }
  #edu-scroll .tray::-webkit-scrollbar{width:0;height:0;background:transparent}

  #edu-scroll .edu-card{
    scroll-snap-align:center;
    flex:0 0 300px; display:grid; grid-template-rows:auto auto 1fr; gap:8px;
    min-height:240px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; box-shadow:none; padding:14px 14px 16px
  }
  #edu-scroll .edu-card .meta{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:1rem; white-space:nowrap; word-break:keep-all}
  #edu-scroll .edu-card .flag-ico{width:24px; height:16px; object-fit:cover; border-radius:2px; box-shadow:0 0 0 1px var(--line)}
  #edu-scroll .edu-card .school{font-weight:800; font-size:1.14rem; line-height:1.25}
  #edu-scroll .edu-card .desc{font-size:1.02rem; line-height:1.38}
  #edu-scroll .edu-card .note{font-size:.94rem; color:var(--muted)}

  .edu-arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    width:38px; height:38px; display:grid; place-items:center;
    border-radius:999px; background:#fff; border:1px solid var(--line);
    box-shadow:var(--shadow); cursor:pointer; z-index:3; font-size:20px
  }
  /* default offsets (mobile hidden anyway) */
  .edu-prev{left:8px} .edu-next{right:8px}
  .edu-arrow:disabled{opacity:.4; cursor:not-allowed}

  @media (min-width:1200px){ #edu-scroll .edu-card{ flex:0 0 320px; } }

  /* ===== Desktop-only: move arrows OUTSIDE + show a scrollbar under ===== */
  @media (min-width: 900px){
    /* Pull arrows out so they don’t overlap cards */
    .edu-prev{ left:-22px; }
    .edu-next{ right:-22px; }

    /* Add space for a visible native scrollbar */
    #edu-scroll .tray{
      padding-bottom: 12px;                /* space for the bar */
      scrollbar-width: thin;               /* Firefox */
      scrollbar-color: rgba(14,165,162,.45) rgba(15,23,42,.08);
    }
    /* WebKit scrollbar styling */
    #edu-scroll .tray::-webkit-scrollbar{
      height: 10px;                        /* visible */
    }
    #edu-scroll .tray::-webkit-scrollbar-track{
      background: rgba(15,23,42,.08);
      border-radius: 999px;
    }
    #edu-scroll .tray::-webkit-scrollbar-thumb{
      background: rgba(14,165,162,.55);
      border-radius: 999px;
    }
    #edu-scroll .tray::-webkit-scrollbar-thumb:hover{
      background: rgba(14,165,162,.7);
    }
  }

  /* ===== Travel map ===== */
  .map-card{ background:transparent; border:none !important; border-radius:0; box-shadow:none; padding:0; overflow:visible; }
  #visitedMap{ height:min(60vh, 520px); width:100%; border-radius:14px; }
  #visitedMap.leaflet-container{ background:transparent !important; }

  .projects{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
  @media (max-width:820px){.projects{grid-template-columns:1fr}}
</style>
</head>
<body>

</html>
