<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bader — Education Posters (Art Prototype)</title>
  <link rel="icon" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#0b0d0f;           /* text */
      --paper:#fefaf3;         /* page background */
      --tape:#ffe58b;          /* masking tape */
      --grid:#e6dfd2;          /* thin grid */
      --loud-1:#0057ff;        /* electric blue */
      --loud-2:#ff0051;        /* magenta red */
      --loud-3:#00c2a8;        /* teal */
      --loud-4:#ffc700;        /* yellow */
      --soft-1:#1b9a94;        /* teal (muted)*/
      --soft-2:#c0a75e;        /* gold (muted)*/
      --radius:18px;
      --shadow:0 30px 100px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0; color:var(--ink);
      background:
        linear-gradient(180deg, #fff 0%, var(--paper) 100%);
      min-height:100dvh;
    }

    /* Background grid + grain */
    body::before{
      content:""; position:fixed; inset:0; z-index:-2; pointer-events:none; opacity:.25;
      background:
        repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 28px),
        repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 28px);
    }
    body::after{
      content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.13;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.35"/></svg>');
      mix-blend-mode:multiply;
    }

    header{position:sticky; top:0; z-index:10; background:rgba(255,255,255,.9); backdrop-filter:saturate(120%) blur(8px); border-bottom:1px solid var(--grid)}
    .bar{max-width:1200px; margin:auto; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px}
    .brand{display:flex; align-items:center; gap:12px; font-family:'Playfair Display', serif; font-weight:800; letter-spacing:.2px}
    .brand .dot{width:20px; height:20px; border-radius:50%; background:conic-gradient(from 200deg, var(--loud-1), var(--loud-2), var(--loud-3), var(--loud-4)); box-shadow:0 6px 16px rgba(0,0,0,.15)}

    .wrap{max-width:1200px; margin:auto; padding:22px 18px}
    h1{margin:6px 0 4px; font-family:'Space Grotesk', ui-sans-serif; font-size:clamp(28px,4.6vw,54px); letter-spacing:-.5px}
    .lead{color:#5b6472}

    /* Toolbar */
    .tools{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:10px 0 2px}
    .btn{border:1px solid var(--grid); padding:10px 14px; border-radius:14px; background:#fff; cursor:pointer; font-weight:700; font-family:'Space Grotesk', ui-sans-serif}
    .btn.loud{background:linear-gradient(135deg, var(--loud-1), var(--loud-2)); color:#fff; border-color:transparent}
    .btn.ghost{background:#fff}

    /* Poster wall */
    .wall{position:relative; min-height:70dvh; transform-style:preserve-3d}

    /* grid layout */
    .posters.grid{display:grid; grid-template-columns:repeat(12, 1fr); gap:16px}

    /* chaos layout (absolute, random) */
    .posters.chaos{position:relative; height:78dvh}

    .poster{
      --bg: var(--loud-1);
      position:relative; overflow:hidden; border-radius:18px; box-shadow:var(--shadow);
      color:#0a0a0a; background:var(--bg);
      border:1px solid rgba(0,0,0,.08);
      isolation:isolate;
      transform-origin:center;
      transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
      will-change:transform;
      cursor:pointer;
    }
    .poster:hover{ transform:translateY(-6px) rotate(-.6deg); filter:saturate(1.05) }

    /* Tape corners */
    .poster::before, .poster::after{
      content:""; position:absolute; width:60px; height:18px; background:var(--tape); opacity:.9; mix-blend-mode:multiply;
      box-shadow:0 2px 6px rgba(0,0,0,.2);
      transform:rotate(var(--tape-rot, -8deg));
    }
    .poster::before{ left:14px; top:10px }
    .poster::after{ right:12px; bottom:10px; transform:rotate(var(--tape-rot2, 6deg)); }

    /* Halftone + gradient overlay */
    .ink{
      position:absolute; inset:0; z-index:0;
      background:
        radial-gradient(120% 120% at 10% 0%, rgba(255,255,255,.25), transparent 60%),
        radial-gradient(120% 120% at 100% 120%, rgba(0,0,0,.18), transparent 60%),
        repeating-radial-gradient(circle at 20% 20%, rgba(255,255,255,.15) 0 2px, transparent 2px 8px);
      mix-blend-mode:multiply;
    }

    /* Poster content */
    .inner{position:relative; z-index:1; padding:18px; height:100%; display:grid; grid-template-rows:auto 1fr auto; gap:4px}
    .row-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
    .flag{width:26px; height:18px; border-radius:2px; object-fit:cover; box-shadow:0 0 0 1px rgba(0,0,0,.18)}

    .year{font-family:'Playfair Display', serif; font-weight:800; font-size:clamp(28px, 5.2vw, 58px); line-height:.9; letter-spacing:-1px}
    .city{font-family:'Space Grotesk', ui-sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.12em}

    .school{font-family:'Space Grotesk', ui-sans-serif; font-weight:700; font-size:clamp(18px,2vw,22px); margin-top:8px}
    .program{font-family:'Space Grotesk', ui-sans-serif; margin-top:2px}

    /* rotated side label */
    .side{position:absolute; right:10px; top:50%; transform:translateY(-50%) rotate(90deg); transform-origin:right top; font-family:'Space Grotesk'; font-weight:700; letter-spacing:.14em; opacity:.8}

    /* sizes per poster in grid mode */
    .span-4{grid-column:span 4; height:320px}
    .span-5{grid-column:span 5; height:360px}
    .span-6{grid-column:span 6; height:380px}

    @media (max-width:900px){
      .posters.grid{grid-template-columns:repeat(6,1fr)}
      .span-6{grid-column:span 6}
      .span-5{grid-column:span 6}
      .span-4{grid-column:span 6}
      .poster{height:340px}
    }

    /* Detail sheet */
    dialog{border:none; padding:0; border-radius:22px; width:min(820px, 94vw); box-shadow:0 50px 160px rgba(0,0,0,.35)}
    dialog::backdrop{background:rgba(14,16,20,.65)}
    .sheet{background:#fff; border-radius:22px; overflow:hidden; border:1px solid var(--grid)}
    .sheet .hero{height:160px; background:var(--bg); position:relative}
    .sheet .hero .ink{opacity:.45}
    .sheet .hd{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; border-bottom:1px solid var(--grid)}
    .sheet .bd{padding:18px}
    .x{border:1px solid var(--grid); border-radius:12px; padding:8px 10px; background:#fff; cursor:pointer}

    .legend{display:flex; gap:12px; align-items:center; color:#5b6472}
    .legend img{width:26px; height:18px; border-radius:2px; box-shadow:0 0 0 1px var(--grid)}
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand"><span class="dot" aria-hidden="true"></span><span>Education — Kinetic Posters</span></div>
      <div class="tools">
        <button class="btn ghost" id="modeBtn">Chaos mode</button>
        <button class="btn ghost" id="shuffleBtn">Shuffle</button>
        <button class="btn loud" id="paletteBtn">Loud colors</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <h1>Artistic & Graphic Prototype</h1>
    <p class="lead">Each school becomes a <em>poster</em> with bold typography, blend modes, and texture. Click a poster for details.</p>

    <section class="wall">
      <div class="posters grid" id="posters"></div>
    </section>
  </main>

  <dialog id="modal">
    <div class="sheet">
      <div class="hero" id="mHero"><div class="ink"></div></div>
      <div class="hd">
        <div style="font-weight:800; font-family:'Space Grotesk'" id="mTitle">Title</div>
        <button class="x" id="mClose" aria-label="Close">✕</button>
      </div>
      <div class="bd" id="mBody"></div>
    </div>
  </dialog>

  <script>
  (function(){
    const data = [
      { year:"2026–2027", city:"Berlin, Germany", code:"de", school:"Freie Universität Berlin — OSI", program:"M.A. International Relations", note:"Expected to start 2026. Comparative security focus with modules on EU foreign and defense policies." },
      { year:"2024–2026", city:"Paris, France", code:"fr", school:"Sciences Po — PSIA", program:"M.A. International Security & Migration", note:"Asylum and migration law, border governance, and humanitarian data analysis; qualitative research design and mapping/data projects." },
      { year:"2024–2025", city:"Paris, France", code:"fr", school:"INALCO — Eurasian Department", program:"Persian Language & Iranian Studies", note:"Intensive Persian (academic texts, conversation) plus history, society, and politics of Iran and Afghanistan." },
      { year:"2023–2024", city:"Tokyo, Japan", code:"jp", school:"Tokyo University of Foreign Studies", program:"Exchange. Asia-Pacific & Japanese Studies", note:"Full-time Japanese intensive alongside Asia-Pacific politics; Japan/ASEAN focus with intercultural fieldwork." },
      { year:"2022–2023", city:"Menton, France", code:"fr", school:"Sciences Po Campus of Menton", program:"B.A. Major in Politics & Government", note:"Middle Eastern & Mediterranean specialization: comparative politics, constitutional law, and regional history; debate workshops tied to current affairs." },
      { year:"2021–2022", city:"Nancy, France", code:"fr", school:"Sciences Po Campus of Nancy", program:"B.A. Introduction to social sciences", note:"Multidisciplinary foundations in political science, economics, sociology, law, and history within a trilingual Franco-German track; EU institutions and academic writing." }
    ];

    const postersEl = document.getElementById('posters');
    const modal = document.getElementById('modal');
    const mTitle = document.getElementById('mTitle');
    const mBody = document.getElementById('mBody');
    const mHero = document.getElementById('mHero');
    document.getElementById('mClose').addEventListener('click', ()=>modal.close());
    modal.addEventListener('click', e=>{ if(e.target===modal) modal.close(); });

    const palettes = {
      soft:["#dff5f2","#f6efe0","#e8f2ff","#fef2f2"],
      loud:["#0057ff","#ff0051","#00c2a8","#ffc700"]
    };
    let loud=false; // palette toggle

    function randomFrom(arr){ return arr[Math.floor(Math.random()*arr.length)] }

    function posterSize(i){
      // vary sizes in grid mode
      const r = i % 3;
      return r===0? 'span-6' : r===1? 'span-5' : 'span-4';
    }
    function posterColor(i){
      const pool = loud? palettes.loud : palettes.soft;
      return randomFrom(pool);
    }

    function buildGrid(){
      postersEl.className = 'posters grid';
      postersEl.innerHTML = data.map((d,i)=>{
        const bg = posterColor(i);
        const size = posterSize(i);
        const rot = (Math.random()*2-1).toFixed(2);
        return `
          <article class="poster ${size}" style="--bg:${bg}; transform: rotate(${rot}deg)" data-idx="${i}">
            <div class="ink" aria-hidden="true"></div>
            <div class="inner">
              <div class="row-top">
                <img class="flag" src="https://flagcdn.com/w40/${d.code}.png" width="26" height="18" alt="${d.city} flag">
                <div class="city">${d.city}</div>
              </div>
              <div>
                <div class="year">${d.year}</div>
                <div class="school">${d.school}</div>
                <div class="program">${d.program}</div>
              </div>
              <div class="side">EDUCATION • ${d.code.toUpperCase()}</div>
            </div>
          </article>`;
      }).join('');
      bindCards();
    }

    function buildChaos(){
      postersEl.className = 'posters chaos';
      postersEl.innerHTML = '';
      const H = postersEl.clientHeight || 600; // viewport for chaos
      const W = postersEl.clientWidth || 1000;
      data.forEach((d,i)=>{
        const bg = posterColor(i);
        const card = document.createElement('article');
        card.className = 'poster';
        card.dataset.idx = i;
        const w = Math.floor(W * (0.26 + Math.random()*0.22));
        const h = Math.floor(H * (0.36 + Math.random()*0.30));
        const x = Math.floor(Math.random()*(W - w));
        const y = Math.floor(Math.random()*(H - h));
        const rot = Math.floor((Math.random()*16)-8);
        card.style.cssText += `--bg:${bg}; width:${w}px; height:${h}px; position:absolute; left:${x}px; top:${y}px; transform:rotate(${rot}deg);`;
        card.innerHTML = `
          <div class="ink" aria-hidden="true"></div>
          <div class="inner">
            <div class="row-top">
              <img class="flag" src="https://flagcdn.com/w40/${d.code}.png" width="26" height="18" alt="${d.city} flag">
              <div class="city">${d.city}</div>
            </div>
            <div>
              <div class="year">${d.year}</div>
              <div class="school">${d.school}</div>
              <div class="program">${d.program}</div>
            </div>
            <div class="side">EDUCATION • ${d.code.toUpperCase()}</div>
          </div>`;
        postersEl.appendChild(card);
      });
      bindCards();
    }

    function bindCards(){
      postersEl.querySelectorAll('.poster').forEach(p=>{
        p.addEventListener('click', ()=>open(+p.dataset.idx, getComputedStyle(p).getPropertyValue('--bg')));
        p.addEventListener('keypress', e=>{ if(e.key==='Enter' || e.key===' '){ open(+p.dataset.idx, getComputedStyle(p).getPropertyValue('--bg')); }});
        p.tabIndex = 0;
      });
    }

    function open(idx, bg){
      const d = data[idx];
      mTitle.textContent = d.school;
      mBody.innerHTML = `
        <div class="legend">
          <img src="https://flagcdn.com/w40/${d.code}.png" width="26" height="18" alt="${d.city} flag">
          <span><strong>${d.year}</strong> — ${d.city}</span>
        </div>
        <h3 style="font-family:'Playfair Display',serif; margin:.6rem 0 0">${d.program}</h3>
        ${d.note ? `<p class="lead" style="margin:.4rem 0 0">${d.note}</p>` : ''}
      `;
      mHero.style.setProperty('--bg', bg || '#ddd');
      mHero.style.background = `linear-gradient(135deg, ${bg} 0%, #ffffff 100%)`;
      modal.showModal();
    }

    // Controls
    const modeBtn = document.getElementById('modeBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const paletteBtn = document.getElementById('paletteBtn');

    let chaos = false;
    function render(){ chaos ? buildChaos() : buildGrid(); }

    modeBtn.addEventListener('click', ()=>{ chaos = !chaos; modeBtn.textContent = chaos? 'Grid mode' : 'Chaos mode'; render(); });
    shuffleBtn.addEventListener('click', ()=>render());
    paletteBtn.addEventListener('click', ()=>{ loud = !loud; paletteBtn.textContent = loud? 'Soft colors' : 'Loud colors'; render(); });

    // Initial render
    render();
  })();
  </script>
</body>
</html>
