<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bader Suliman – Portfolio</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin="" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Trebuchet MS", Verdana, sans-serif;
      background: #ffffff; color: #111;
    }

    /* Container */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Header */
    header { text-align: center; margin-bottom: 40px; }
    header h1 {
      font-size: 3rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    nav a {
      padding: 8px 18px;
      border-radius: 12px;
      border: 2px solid #d0d7de;
      text-decoration: none;
      color: #333;
      transition: 0.25s;
    }

    nav a.active,
    nav a:hover {
      border-color: #009fa5;
      background: #e6f9f9;
      color: #009fa5;
    }

    /* ============================================
       EDUCATION MAP WRAPPER + GRADIENT BOXES
    ============================================ */

    .education-maps {
      display: none;
      width: 100%;
      justify-content: center;
      align-items: flex-start;
      gap: 80px;
      margin-top: 60px;
    }

    .map-column {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .map-label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      margin-bottom: 14px;
    }

    .map-box {
      width: 340px;
      height: 340px;

      background: linear-gradient(135deg, #0aa8c7, #009fa5 70%);
      padding: 12px;
      border-radius: 18px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .country-map {
      width: 100%;
      height: 100%;
      border-radius: 14px;

      background: #ffffff;
    }

    .leaflet-container {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    /* ============================================
                 GALLERY (UNCHANGED)
    ============================================ */
    .gallery {
      grid-auto-rows: 200px;
      grid-auto-flow: dense;
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      background: #eee;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(40%) brightness(0.85);
      opacity: 0.7;
      transition: all 0.35s ease-out;
    }

    .gallery-item:hover img {
      opacity: 1;
      filter: none;
      transform: scale(1.03);
    }

    /* Scroll progress bar */
    #scrollProgress {
      position: fixed; top: 0; left: 0;
      width: 0; height: 4px;
      background: #009fa5;
      z-index: 9999;
    }

    /* Back to top */
    #backToTop {
      position: fixed;
      bottom: 24px; right: 24px;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #009fa5;
      border: none;
      display: none;
      justify-content: center;
      align-items: center;
      color: white; font-size: 22px;
      cursor: pointer;
      z-index: 9999;
    }


    /* ============================================
                 LIGHTBOX RESTORED FULL
    ============================================ */

    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }

    .lightbox {
      background: white;
      padding: 16px;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    .lightbox-image {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
    }

    .lightbox-caption {
      margin-top: 8px;
      text-align: center;
      font-size: 0.9rem;
      color: #444;
    }

    .lightbox-counter {
      margin-top: 4px;
      font-size: 0.8rem;
      color: #777;
    }

    .lightbox-close {
      position: absolute;
      right: 12px;
      bottom: 10px;
      font-size: 26px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .lightbox-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.9);
      width: 38px;
      height: 60px;
      border: none;
      cursor: pointer;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .lightbox-arrow.left { left: -50px; }
    .lightbox-arrow.right { right: -50px; }

  </style>
</head>

<body>

  <div id="scrollProgress"></div>

  <div class="page">
    <header>
      <h1>Bader Suliman</h1>
      <nav>
        <ul>
          <li><a href="#home" class="active">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#education">Education</a></li>
          <li><a href="#experience">Experience</a></li>
          <li><a href="#work">Work</a></li>
          <li><a href="#activities">Activities</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- EDUCATION -->
    <main id="home">

      <section id="education">
        <div class="education-maps">

          <!-- FRANCE -->
          <div class="map-column">
            <div class="map-label">FRANCE</div>
            <div class="map-box">
              <div id="map-france" class="country-map"></div>
            </div>
          </div>

          <!-- JAPAN -->
          <div class="map-column">
            <div class="map-label">JAPAN</div>
            <div class="map-box">
              <div id="map-japan" class="country-map"></div>
            </div>
          </div>

          <!-- GERMANY -->
          <div class="map-column">
            <div class="map-label">GERMANY</div>
            <div class="map-box">
              <div id="map-germany" class="country-map"></div>
            </div>
          </div>

        </div>
      </section>

      <!-- GALLERY -->
      <section class="gallery">
        <a class="gallery-item"><img src="image1.jpg" data-caption="Paris, France – March 2024"></a>
        <a class="gallery-item"><img src="image2.jpg" data-caption="Valletta, Malta – Nov 2024"></a>
        <a class="gallery-item"><img src="image3.jpg" data-caption="Amman, Jordan – July 2023"></a>
        <a class="gallery-item"><img src="img1.jpg" data-caption="Tbilisi, Georgia – May 2024"></a>
        <a class="gallery-item"><img src="images/img5.jpg" data-caption="Berlin, Germany – Sept 2021"></a>
        <a class="gallery-item"><img src="images/img6.jpg" data-caption="Muscat, Oman – Apr 2025"></a>
      </section>

    </main>
  </div>

  <!-- Back to top -->
  <button id="backToTop">↑</button>

  <!-- LIGHTBOX -->
  <div id="lightboxOverlay" class="lightbox-overlay">
    <div class="lightbox">
      <button class="lightbox-arrow left" id="lightboxPrev">‹</button>
      <button class="lightbox-arrow right" id="lightboxNext">›</button>

      <img id="lightboxImage" class="lightbox-image">
      <div id="lightboxCaption" class="lightbox-caption"></div>
      <div id="lightboxCounter" class="lightbox-counter"></div>

      <button class="lightbox-close" id="lightboxClose">×</button>
    </div>
  </div>

  <!-- LEAFLET JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <script>
    /* Progress bar */
    window.addEventListener("scroll", () => {
      const s = window.scrollY;
      const d = document.documentElement.scrollHeight - window.innerHeight;
      document.getElementById("scrollProgress").style.width = (s / d) * 100 + "%";
    });

    /* Back to top */
    window.addEventListener("scroll", () => {
      document.getElementById("backToTop").style.display =
        window.scrollY > 300 ? "flex" : "none";
    });
    document.getElementById("backToTop").onclick = () =>
      window.scrollTo({ top: 0, behavior: "smooth" });


    /* ===============================
       MAPS
    =============================== */
    let worldData = null;
    let mapsLoaded = false;

    const COUNTRY_NAMES = {
      france: ["france"],
      germany: ["germany"],
      japan: ["japan"]
    };

    const normalize = s =>
      s.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

    async function loadGeoJSON() {
      if (worldData) return worldData;

      const urls = [
        "https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json",
        "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson"
      ];

      for (let url of urls) {
        try {
          let r = await fetch(url);
          if (r.ok) return (worldData = await r.json());
        } catch {}
      }
    }

    function drawCountry(containerId, country, center, zoom) {
      const map = L.map(containerId, {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        touchZoom: false,
        keyboard: false
      });

      map.setView(center, zoom);

      const aliases = COUNTRY_NAMES[country].map(normalize);

      L.geoJSON(worldData, {
        filter: f =>
          aliases.includes(normalize(f.properties.ADMIN || f.properties.name)),
        style: { color: "#222", weight: 1.8, fillOpacity: 0 }
      }).addTo(map);
    }

    async function initMaps() {
      if (mapsLoaded) return;
      mapsLoaded = true;

      await loadGeoJSON();

      document.querySelector(".education-maps").style.display = "flex";

      drawCountry("map-france", "france", [46.6, 2.2], 4.0);
      drawCountry("map-japan", "japan", [37.8, 138.5], 3.7);
      drawCountry("map-germany", "germany", [51.1, 10.3], 4.3);
    }


    /* ===============================
       NAVIGATION
    =============================== */

    document.querySelectorAll("nav a").forEach(a => {
      a.addEventListener("click", () => {
        const target = a.getAttribute("href");

        document.querySelectorAll("nav a").forEach(n => n.classList.remove("active"));
        a.classList.add("active");

        if (target === "#education") {
          document.querySelector(".gallery").style.display = "none";
          initMaps();
        } else {
          document.querySelector(".gallery").style.display = "grid";
        }
      });
    });


    /* ===============================
           LIGHTBOX (RESTORED)
    =============================== */
    const overlay = document.getElementById("lightboxOverlay");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const lightboxCounter = document.getElementById("lightboxCounter");
    const btnPrev = document.getElementById("lightboxPrev");
    const btnNext = document.getElementById("lightboxNext");
    const btnClose = document.getElementById("lightboxClose");

    const galleryImages = Array.from(document.querySelectorAll(".gallery-item img"));
    let currentIndex = 0;

    function openLightbox(index) {
      currentIndex = index;
      const img = galleryImages[currentIndex];

      lightboxImage.src = img.src;
      lightboxCaption.textContent = img.dataset.caption || "";
      lightboxCounter.textContent =
        (currentIndex + 1) + " / " + galleryImages.length;

      overlay.style.display = "flex";
    }

    function closeLightbox() {
      overlay.style.display = "none";
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % galleryImages.length;
      openLightbox(currentIndex);
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
      openLightbox(currentIndex);
    }

    galleryImages.forEach((img, index) => {
      img.addEventListener("click", e => {
        e.preventDefault();
        openLightbox(index);
      });
    });

    btnNext.addEventListener("click", showNext);
    btnPrev.addEventListener("click", showPrev);
    btnClose.addEventListener("click", closeLightbox);

    overlay.addEventListener("click", e => {
      if (e.target === overlay) closeLightbox();
    });

    document.addEventListener("keydown", e => {
      if (overlay.style.display !== "flex") return;

      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowRight") showNext();
      if (e.key === "ArrowLeft") showPrev();
    });

  </script>

</body>
</html>
