<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bader — Education Showcase (Index Cards)</title>
  <link rel="icon" href="favicon.png" />
  <style>
    :root{
      --paper:#fffbf5;        /* warm paper */
      --ink:#0f172a;          /* text */
      --mute:#475569;         /* secondary */
      --line:#e6dfd2;         /* pencil line */
      --accent:#1b9a94;       /* teal */
      --accent2:#c0a75e;      /* gold */
      --shadow:0 18px 50px rgba(15,23,42,.12);
      --radius:18px;
      --maxw:1100px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Roboto, Arial;
      color:var(--ink); background:
        radial-gradient(1200px 800px at 10% 0%, #ffffff 0%, #fff9f3 45%, var(--paper) 100%),
        linear-gradient(180deg, #fff 0%, var(--paper) 100%);
      min-height:100dvh; overflow-x:hidden;
    }
    a{color:var(--accent); text-decoration:none}

    /* Header */
    header{position:sticky; top:0; z-index:10; backdrop-filter:saturate(115%) blur(10px); background:rgba(255,255,255,.85); border-bottom:1px solid var(--line)}
    .bar{display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:var(--maxw); margin:auto; padding:12px 18px}
    .brand{display:flex; align-items:center; gap:10px; font-weight:800}
    .badge{width:28px; height:28px; border-radius:8px; background:conic-gradient(from 220deg, var(--accent), #39d5cd); animation:spin 18s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Stage */
    .wrap{max-width:var(--maxw); margin:auto; padding:18px}
    h1{margin:10px 0 4px; font-size:clamp(28px,4vw,40px)}
    .lead{color:var(--mute)}

    /* Index-card carousel */
    .stage{position:relative; perspective:1200px; margin-top:18px}
    .rail{display:flex; gap:18px; align-items:stretch; overflow-x:auto; padding:16px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch}
    .rail::-webkit-scrollbar{height:10px}
    .rail::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12); border-radius:8px}

    .card{scroll-snap-align:center; flex:0 0 clamp(280px, 38vw, 340px);
      background:#fff; border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:16px; position:relative; overflow:hidden;
      transform-style:preserve-3d; transition:transform .25s ease, box-shadow .25s ease;
    }
    .card:hover{transform:translateY(-6px) rotateX(2deg) rotateY(-2deg)}
    .meta{display:flex; align-items:center; gap:8px; color:var(--mute)}
    .flag{width:26px; height:18px; border-radius:2px; object-fit:cover; box-shadow:0 0 0 1px var(--line)}
    .school{font-weight:800; margin-top:8px; font-size:1.1rem}
    .program{margin-top:4px}
    .note{margin-top:8px; color:var(--mute); font-size:.96rem}

    .pin{position:absolute; right:12px; top:12px; width:10px; height:10px; border-radius:50%; background:var(--accent)}
    .tear{position:absolute; left:-30px; bottom:-30px; width:160px; height:160px; background:radial-gradient(closest-side, rgba(192,167,94,.15), transparent 70%); transform:rotate(24deg)}

    /* Toolbar */
    .tools{display:flex; gap:8px; align-items:center; margin-top:8px}
    .btn{display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:14px; border:1px solid var(--line); font-weight:700; background:#fff; cursor:pointer}
    .btn.primary{background:linear-gradient(135deg, var(--accent), #27bdb6); color:#fff; border-color:transparent}

    /* Modal for detail view */
    dialog{border:none; padding:0; border-radius:22px; width:min(760px, 92vw); box-shadow:0 40px 120px rgba(15,23,42,.25)}
    dialog::backdrop{background:rgba(15,23,42,.55)}
    .sheet{background:#fff; border:1px solid var(--line); border-radius:22px; overflow:hidden}
    .sheet .hd{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line)}
    .sheet .bd{padding:18px}
    .x{border:1px solid var(--line); border-radius:12px; padding:8px 10px; background:#fff; cursor:pointer}

    /* Keyboard hint */
    .kbd{display:inline-block; padding:4px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; box-shadow:inset 0 -2px 0 rgba(0,0,0,.04)}

    /* Footer */
    footer{padding:18px; color:var(--mute); text-align:center}

    :focus-visible{outline:3px solid rgba(27,154,148,.4); outline-offset:3px}
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand"><div class="badge" aria-hidden="true"></div><span>Bader Suliman</span></div>
      <div class="lead">Prototype — <strong>Education</strong> section (index cards)</div>
    </div>
  </header>

  <main class="wrap">
    <h1>Education — Index Card Carousel</h1>
    <p class="lead">Hover, drag horizontally, or press <span class="kbd">←</span>/<span class="kbd">→</span>. Click a card to open details.</p>

    <div class="tools">
      <button class="btn" id="shuffleBtn" aria-label="Shuffle cards">Shuffle</button>
      <button class="btn primary" id="focusBtn" aria-label="Focus center card">Focus center</button>
    </div>

    <section class="stage" aria-label="Education cards">
      <div class="rail" id="rail"></div>
    </section>
  </main>

  <dialog id="modal">
    <div class="sheet">
      <div class="hd">
        <div style="font-weight:800" id="mTitle">Title</div>
        <button class="x" id="mClose" aria-label="Close">✕</button>
      </div>
      <div class="bd" id="mBody">...</div>
    </div>
  </dialog>

  <footer>© 2025 Bader Suliman</footer>

  <script>
  (function(){
    const data = [
      { year:"2026–2027", city:"Berlin, Germany", code:"de", school:"Freie Universität Berlin — OSI", program:"M.A. International Relations", note:"Expected to start 2026. Comparative security focus with modules on EU foreign and defense policies." },
      { year:"2024–2026", city:"Paris, France", code:"fr", school:"Sciences Po — PSIA", program:"M.A. International Security & Migration", note:"Asylum and migration law, border governance, and humanitarian data analysis; qualitative research design and mapping/data projects." },
      { year:"2024–2025", city:"Paris, France", code:"fr", school:"INALCO — Eurasian Department", program:"Persian Language & Iranian Studies", note:"Intensive Persian (academic texts, conversation) plus history, society, and politics of Iran and Afghanistan." },
      { year:"2023–2024", city:"Tokyo, Japan", code:"jp", school:"Tokyo University of Foreign Studies", program:"Exchange. Asia-Pacific & Japanese Studies", note:"Full-time Japanese intensive alongside Asia-Pacific politics; Japan/ASEAN focus with intercultural fieldwork." },
      { year:"2022–2023", city:"Menton, France", code:"fr", school:"Sciences Po Campus of Menton", program:"B.A. Major in Politics & Government", note:"Middle Eastern & Mediterranean specialization: comparative politics, constitutional law, and regional history; debate workshops tied to current affairs." },
      { year:"2021–2022", city:"Nancy, France", code:"fr", school:"Sciences Po Campus of Nancy", program:"B.A. Introduction to social sciences", note:"Multidisciplinary foundations in political science, economics, sociology, law, and history within a trilingual Franco-German track; EU institutions and academic writing." }
    ];

    const rail = document.getElementById('rail');
    const modal = document.getElementById('modal');
    const mTitle = document.getElementById('mTitle');
    const mBody = document.getElementById('mBody');
    const mClose = document.getElementById('mClose');

    rail.innerHTML = data.map((d,i)=>`
      <article class="card" tabindex="0" data-idx="${i}">
        <span class="pin" aria-hidden="true"></span>
        <div class="tear" aria-hidden="true"></div>
        <div class="meta">
          <img class="flag" src="https://flagcdn.com/w40/${d.code}.png" width="26" height="18" alt="${d.city} flag">
          <span>${d.year} • ${d.city}</span>
        </div>
        <div class="school">${d.school}</div>
        <div class="program">${d.program}</div>
        ${d.note ? `<div class="note">${d.note}</div>` : ''}
      </article>
    `).join('');

    function openCard(idx){
      const d = data[idx];
      if(!d) return;
      mTitle.textContent = d.school;
      mBody.innerHTML = `
        <div style="display:flex; align-items:center; gap:10px; color:var(--mute)">
          <img class="flag" src="https://flagcdn.com/w40/${d.code}.png" width="26" height="18" alt="${d.city} flag">
          <strong>${d.year}</strong> — ${d.city}
        </div>
        <h3 style="margin:.6rem 0 0">${d.program}</h3>
        ${d.note ? `<p class="lead" style="margin:.4rem 0 0">${d.note}</p>` : ''}
      `;
      modal.showModal();
    }

    rail.querySelectorAll('.card').forEach(el=>{
      el.addEventListener('click',()=>openCard(+el.dataset.idx));
      el.addEventListener('keypress',e=>{ if(e.key==='Enter' || e.key===' ') { e.preventDefault(); openCard(+el.dataset.idx); } });
    });

    mClose.addEventListener('click',()=>modal.close());
    modal.addEventListener('click',e=>{ if(e.target===modal) modal.close(); });

    // Toolbar actions
    const shuffleBtn = document.getElementById('shuffleBtn');
    const focusBtn = document.getElementById('focusBtn');

    function shuffle(){
      const children = Array.from(rail.children);
      for(let i=children.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        rail.appendChild(children[j]);
        children.splice(j,1);
      }
    }

    function focusCenter(){
      const rect = rail.getBoundingClientRect();
      const mid = rect.left + rect.width/2;
      let bestEl = null, bestDist = Infinity;
      rail.querySelectorAll('.card').forEach(el=>{
        const r = el.getBoundingClientRect();
        const c = r.left + r.width/2;
        const dist = Math.abs(c - mid);
        if(dist < bestDist){ bestDist = dist; bestEl = el; }
      });
      if(bestEl){ bestEl.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'}); bestEl.focus({preventScroll:true}); }
    }

    shuffleBtn.addEventListener('click', shuffle);
    focusBtn.addEventListener('click', focusCenter);

    // Keyboard navigation
    window.addEventListener('keydown', e=>{
      if(e.key==='ArrowRight') rail.scrollBy({left: 320, behavior:'smooth'});
      if(e.key==='ArrowLeft') rail.scrollBy({left:-320, behavior:'smooth'});
    }, {passive:true});
  })();
  </script>
</body>
</html>
