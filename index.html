<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bader Suliman – Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Trebuchet MS", Verdana, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* ---------- HEADER ---------- */

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 2.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    nav ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    nav a {
      text-decoration: none;
      color: #333;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* ---------- MASONRY GALLERY ---------- */

    .gallery {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      grid-auto-rows: 180px;      /* base row height */
      grid-auto-flow: dense;      /* pack items tightly like masonry */
      gap: 12px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      background: #eee;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;          /* crops image to tile shape */
      display: block;
      transition: transform 0.25s ease-out;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
    }

    /* tile size variations */
    .gallery-item.wide {
      grid-column: span 2;
    }

    .gallery-item.tall {
      grid-row: span 2;
    }

    .gallery-item.big {
      grid-column: span 2;
      grid-row: span 2;
    }

    /* ---------- RESPONSIVE ---------- */

    @media (max-width: 1024px) {
      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      }
    }

    @media (max-width: 768px) {
      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        grid-auto-rows: 160px;
      }

      header h1 {
        font-size: 2.1rem;
      }
    }

    @media (max-width: 480px) {
      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        grid-auto-rows: 150px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <h1>Bader Suliman</h1>
      <nav>
        <ul>
          <li><a href="#about">About</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#education">Education</a></li>
          <li><a href="#experience">Experience</a></li>
          <li><a href="#work">Work</a></li>
          <li><a href="#activities">Activities</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- ---------- MASONRY GALLERY ---------- -->
    <main>
      <section class="gallery">
        <!-- Change src paths to your actual images in /images/ -->

        <!-- Big hero tile -->
        <a class="gallery-item big" href="#">
          <img src="image1.jpg" alt="Image 1">
        </a>

        <!-- Wide landscape -->
        <a class="gallery-item wide" href="#">
          <img src="image2.jpg" alt="Image 2">
        </a>

        <!-- Normal tiles -->
        <a class="gallery-item" href="#">
          <img src="image3.jpg" alt="Image 3">
        </a>

        <a class="gallery-item tall" href="#">
          <img src="images/img4.jpg" alt="Image 4">
        </a>

        <a class="gallery-item" href="#">
          <img src="images/img5.jpg" alt="Image 5">
        </a>

        <a class="gallery-item wide" href="#">
          <img src="images/img6.jpg" alt="Image 6">
        </a>

        <a class="gallery-item" href="#">
          <img src="images/img7.jpg" alt="Image 7">
        </a>

        <a class="gallery-item tall" href="#">
          <img src="images/img8.jpg" alt="Image 8">
        </a>

        <a class="gallery-item" href="#">
          <img src="images/img9.jpg" alt="Image 9">
        </a>

        <a class="gallery-item wide" href="#">
          <img src="images/img10.jpg" alt="Image 10">
        </a>
      </section>
    </main>
  </div>
</body>
</html>
