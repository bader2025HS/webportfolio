<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bader Suliman – Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Trebuchet MS", Verdana, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    /* Container */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 3rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    nav ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    nav a {
      text-decoration: none;
      color: #333;
    }

    nav a:hover {
      text-decoration: underline;
    }

  ./* Masonry-style gallery */
.gallery {
  column-count: 4;        /* number of columns on large screens */
  column-gap: 12px;       /* space between columns */
  margin-top: 20px;
}

.gallery-item {
  display: inline-block;  /* needed for column layout */
  width: 100%;
  margin-bottom: 12px;    /* vertical gap between images */
  break-inside: avoid;    /* prevent images from breaking between columns */
  background: #eee;
  overflow: hidden;
}

.gallery-item img {
  width: 100%;
  height: auto;           /* keep original aspect ratio → different heights */
  display: block;
  border-radius: 0;
  transition: transform 0.25s ease-out;
}

.gallery-item:hover img {
  transform: scale(1.03); /* subtle zoom on hover */
}

/* Responsive: fewer columns on smaller screens */
@media (max-width: 1024px) {
  .gallery {
    column-count: 3;
  }
}

@media (max-width: 768px) {
  .gallery {
    column-count: 2;
  }
}

@media (max-width: 480px) {
  .gallery {
    column-count: 1;
  }
}

  </style>
</head>
<body>
  <div class="page">

    <header>
      <h1>Bader Suliman</h1>
      <nav>
        <ul>
          <li><a href="#about">About</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#education">Education</a></li>
          <li><a href="#experience">Experience</a></li>
          <li><a href="#work">Work</a></li>
          <li><a href="#activities">Activities</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- The gallery will go below this line -->

    <main>
      <section class="gallery">
        <a class="gallery-item" href="#">
          <img src="image1.jpg" alt="Image 1" />
        </a>
        <a class="gallery-item" href="#">
          <img src="image2.jpg" alt="Image 2" />
        </a>
        <a class="gallery-item" href="#">
          <img src="image3.jpg" alt="Image 3" />
        </a>
        <a class="gallery-item" href="#">
          <img src="images/img4.jpg" alt="Image 4" />
        </a>
        <a class="gallery-item" href="#">
          <img src="images/img5.jpg" alt="Image 5" />
        </a>
        <a class="gallery-item" href="#">
          <img src="images/img6.jpg" alt="Image 6" />
        </a>
      </section>
    </main>

  </div>
</body>
</html>
